[package]
name = "fitbit-cli"
version = "0.1.1"
edition = "2021"
description = "Read your own Fitbit data through its first-party web sign-in and API."
license = "MIT"
repository = "https://github.com/raitoxlol/fitbit-cli"
homepage = "https://github.com/raitoxlol/fitbit-cli"
keywords = ["fitbit", "health", "api", "cli", "mcp"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
getrandom = "0.3"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[profile.release]
lto = true
strip = true
